services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gestion_documental_mssql
    restart: unless-stopped
    user: root
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=SqlAdminSucre2026!
      - MSSQL_PID=Developer
      - TZ=America/La_Paz
    volumes:
      - mssql_data:/var/opt/mssql/data
      - /etc/localtime:/etc/localtime:ro

volumes:
  mssql_data:
    driver: local
